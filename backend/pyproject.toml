[project]
name = "sautirelay-backend"
version = "0.1.0"
description = "Local-first FastAPI backend for SautiRelay"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.49",
    "fastapi>=0.115.0",
    "mangum>=0.21.0",
    "openai>=2.36.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "isort>=8.0.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6.0.2",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", ".pytest_cache", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # FastAPI dependency injection commonly uses call expressions in defaults.
    "B008",
    # Existing API schemas inherit from str + Enum for broad compatibility with Pydantic/OpenAPI output.
    "UP042",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
