[project]
name = "sautirelay-backend"
version = "0.1.0"
description = "Local-first FastAPI backend for SautiRelay"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "isort>=8.0.1",
    "openai>=2.36.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
